<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/materialize/css/materialize.min.css" />
    <!-- <link rel="stylesheet" href="assets/materialize/css/materialize-rtl.css" /> -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/util.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Users Managment</title>
  </head>
  <body x-data="usersData">
    <!-- NAV Section -------------- Start ---------- -->
    <nav class="white z-depth-0 top-navbar">
      <div class="nav-wrapper">
        <a href="#!" class="blue-text hide-on-med-and-up">Home</a>
        <a href="#" data-target="mobile-demo" class="sidenav-trigger blue-text"
          ><i class="material-icons">menu</i></a
        >
        <ul class="hide-on-med-and-down">
          <li><a href="index.html" class="blue-text">Home</a></li>
          <li><a href="sass.html" class="blue-text">Instagram</a></li>
          <li><a href="badges.html" class="blue-text">Telegram</a></li>
          <li><a href="users.html" class="blue-text">Users</a></li>
        </ul>
      </div>
    </nav>

    <ul class="sidenav" id="mobile-demo">
      <li>
        <div class="user-view">
          <div class="background">
            <img src="assets/images/images.jpg" />
          </div>
          <a href="#user"><img class="circle" src="assets/images/pic.jpg" /></a>
          <a href="#name"
            ><span class="white-text name">Zolfaghar Abbasi</span></a
          >
          <a href="#email"
            ><span class="white-text email">abbasi.z1366@gmail.com</span></a
          >
        </div>
      </li>
      <li>
        <a href="#!"><i class="material-icons">insert_link</i>Instagram</a>
      </li>
      <li>
        <a href="#!"><i class="material-icons">insert_link</i>Telegram</a>
      </li>
      <li><div class="divider"></div></li>
      <li><a class="subheader">Pages</a></li>
      <li><a class="waves-effect" href="index.html">Home</a></li>
      <li><a class="waves-effect" href="users.html">Users</a></li>
    </ul>
    <!-- NAV Section -------------- End ------------ -->

    <!-- Content Section -----------------start----------- -->
    <section id="top-actions-section" class="row m-b-0 container">
      <!-- Add Button----------------------- -->
      <div class="p-l-10 p-r-10 p-t-10 col s12 m4 l2">
        <button
          id="add_user_button"
          class="waves-effect waves-light btn blue darken-2 p-l-30 p-r-30 w-full rounded_pill flex-c"
          x-on:click="showAddModal = true"
        >
          <i class="material-icons m-r-5">add</i>ADD USER
        </button>
      </div>

      <!-- Search Section------------------- -->
      <div class="row col s12 m8 l8 m-b-5">
        <div
          class="input-field col s12"
          x-init="$watch('searchChar' , value => handleSearch(value))"
        >
          <input
            id="search"
            type="text"
            class="validate"
            x-model="searchChar"
          />
          <label for="search">
            <i class="material-icons pos-relative top-7">search</i>
            Search</label
          >
        </div>
      </div>
      <div class="col l2 hide-on-med-and-down"></div>
    </section>

    <div class="center-align" x-show="isLoading">
      <div class="preloader-wrapper small active">
        <div class="spinner-layer spinner-green-only">
          <div class="circle-clipper left">
            <div class="circle"></div>
          </div>
          <div class="gap-patch">
            <div class="circle"></div>
          </div>
          <div class="circle-clipper right">
            <div class="circle"></div>
          </div>
        </div>
      </div>
    </div>
    <section class="user_list_section" x-init="getUsers()">
      <ul class="collapsible hide-on-med-and-up user-list">
        <template x-for="user in pageUsers">
          <li class="user_list_item">
            <div class="collapsible-header">
              <i
                class="material-icons blue-text darken-2 user_list_arrow_icon trans-0-2"
                >arrow_drop_down_circle</i
              >
              <span x-text="user.name"></span>
            </div>
            <div class="collapsible-body">
              <div class="p-all-5">
                <span class="f-bold">Id:</span>
                <span x-text="user.id"></span>
              </div>
              <div class="p-all-5">
                <span class="f-bold">Username:</span>
                <span x-text="user.username"></span>
              </div>
              <div class="p-all-5">
                <span class="f-bold">Email:</span>
                <span x-text="user.email"></span>
              </div>
              <div class="p-all-5">
                <span class="f-bold">Address:</span>
                <span
                  x-text="(user.address?.city || '') + ' - '+ (user.address?.street || '')"
                ></span>
              </div>
              <div class="p-all-5 flex-l-m">
                <span class="f-bold">Action:</span>
                <span>
                  <i class="material-icons red-text m-l-5 m-r-5"
                    >delete_forever</i
                  >
                  <i class="material-icons orange-text darken-2 m-l-5 m-r-5"
                    >edit</i
                  >
                </span>
              </div>
            </div>
          </li>
        </template>
      </ul>

      <div class="hide-on-med-and-down show-on-medium-and-up">
        <table class="striped highlight centered container">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Username</th>
              <th>Email</th>
              <th>Address</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody class="desktop-table-body">
            <template x-for="user in pageUsers">
              <tr>
                <td x-text="user.id"></td>
                <td x-text="user.name"></td>
                <td x-text="user.username"></td>
                <td x-text="user.email"></td>
                <td
                  x-text="(user.address?.city || '' )+ ' - ' + (user.address?.street || '')"
                ></td>
                <td>
                  <i class="material-icons red-text m-l-5 m-r-5"
                    >delete_forever</i
                  >
                  <i class="material-icons orange-text darken-2 m-l-5 m-r-5"
                    >edit</i
                  >
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Pagination Container------------------ -->
      <div
        class="pagination-container container p-l-9 p-r-9 p-t-10 p-b-10 flex-sb-m pos-fixed left-0 right-0 bottom-0 z-depth-4 rounded_top_30"
      >
        <div class="pagination-item-counts flex-l p-l-10 flex-l-m">
          showing
          <span
            class="m-l-5 m-r-5 max-w-50 pos-relative top-3"
            x-init="$watch('itemsCount' , (value) => handleChangeItemsCount(value))"
          >
            <input
              type="number"
              class="blue-text darken-2 no-border center-align m-b-0"
              x-model="itemsCount"
              x-on:change="pagination()"
            />
          </span>
          of
          <span
            class="blue-text darken-2 m-l-10 m-r-5"
            x-text="users.length"
          ></span>
        </div>

        <span
          class="blue-text darken-2 m-l-10 m-r-5"
          x-text="'page '+currentPage"
        ></span>

        <div class="pagination-buttons">
          <i
            class="material-icons blue darken-2 m-l-5 m-r-5 p-l-5 p-r-5 p-t-2 p-b-2 white-text waves-effect waves-light rounded_pill"
            x-on:click="prevPage()"
            >keyboard_arrow_left</i
          >
          <i
            class="material-icons blue darken-2 m-l-5 m-r-5 p-l-5 p-r-5 p-t-2 p-b-2 white-text waves-effect waves-light rounded_pill"
            x-on:click="nextPage()"
            >keyboard_arrow_right</i
          >
        </div>
      </div>
    </section>

    <!-- Add User Modal------------------------ -->
    <div
      class="add-user-modal-back"
      x-show="showAddModal"
      x-transition.1000
      x-on:click="showAddModal = false"
    ></div>
    <div
      class="add-user-modal container rounded_top_30 trans-0-3"
      x-bind:class="{'show' : showAddModal}"
    >
      <div class="row p-l-40 p-r-40 p-t-10 p-b-10 center-on-small-only">
        <h5>
          <i class="material-icons m-l-10 m-r-10 pos-relative top-4"
            >person_add</i
          >
          Add User
        </h5>

        <form>
          <div class="input-field col s12">
            <input
              id="name"
              type="text"
              class="validate"
              x-model="newUserInfo.name"
            />
            <label for="name">Name:</label>
          </div>
          <div class="input-field col s12">
            <input
              id="username"
              type="text"
              class="validate"
              x-model="newUserInfo.username"
            />
            <label for="username">Username:</label>
          </div>
          <div class="input-field col s12">
            <input
              id="email"
              type="email"
              class="validate"
              x-model="newUserInfo.email"
            />
            <label for="email">Email:</label>
          </div>
          <div class="input-field col s12">
            <input
              id="address"
              type="text"
              class="validate"
              x-model="newUserInfo.address"
            />
            <label for="address">Address:</label>
          </div>

          <button
            type="button"
            class="waves-effect waves-light btn blue darken-1 m-t-20 m-b-10 w-full max-w-250 rounded_pill pulse"
            x-on:click="handleAddUserForm()"
            x-bind:class="{'pulse' : isLoading}"
            x-bind:disabled="isLoading"
          >
            Submit
          </button>
        </form>
      </div>
    </div>

    <!-- Content Section----------------END---------- -->

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script src="assets/js/alpineJsController/usersController.js"></script>
    <script src="assets/js/axios.js"></script>
    <script src="assets/materialize/js/materialize.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/users.js"></script>
  </body>
</html>
